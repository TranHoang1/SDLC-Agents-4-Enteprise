<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <rect width="1000" height="400" fill="#1e1e2e" rx="10"/>
  <text x="500" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">TDD Component Interaction Flow</text>

  <rect x="50" y="80" width="220" height="260" fill="#181825" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="160" y="110" fill="#89b4fa" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VS Code Extension</text>
  <text x="70" y="150" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">IndexingService</text>
  <text x="70" y="180" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">PegaHttpClient</text>
  <text x="70" y="210" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">saveRuleToWorkspace()</text>
  <text x="70" y="250" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10">Writes .pega.json files</text>

  <rect x="390" y="80" width="220" height="260" fill="#181825" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="500" y="110" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Backend Server</text>
  <text x="410" y="150" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">/pega/fetch-rule</text>
  <text x="410" y="180" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">PegaRuleFetcherService</text>
  <text x="410" y="210" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">PegaService &amp; DB</text>
  <text x="410" y="250" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10">Parses AST &amp; Stores DB</text>

  <rect x="730" y="80" width="220" height="260" fill="#181825" stroke="#fab387" stroke-width="2" rx="8"/>
  <text x="840" y="110" fill="#fab387" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pega Platform</text>
  <text x="750" y="150" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">REST Service Package</text>
  <text x="750" y="180" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">pzGetRuleXML Activity</text>
  <text x="750" y="210" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">PRServlet Session</text>
  <text x="750" y="250" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10">Returns 27KB+ XML/JSON</text>

  <line x1="270" y1="210" x2="390" y2="210" stroke="#89b4fa" stroke-width="2"/>
  <line x1="610" y1="210" x2="730" y2="210" stroke="#a6e3a1" stroke-width="2"/>
