<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" width="1100" height="550">
  <rect width="1100" height="550" fill="#1e1e2e" rx="10"/>
  
  <!-- Title -->
  <text x="550" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">End-to-End SDLC Agent Sequence Flow (SA4E-57)</text>

  <!-- Lifeline Headers -->
  <g transform="translate(0, 60)">
    <!-- Scrum Master -->
    <rect x="60" y="0" width="160" height="40" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
    <text x="140" y="25" fill="#89b4fa" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Scrum Master (SM)</text>
    <line x1="140" y1="40" x2="140" y2="450" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- VS Code Extension -->
    <rect x="310" y="0" width="160" height="40" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
    <text x="390" y="25" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VS Code Extension</text>
    <line x1="390" y1="40" x2="390" y2="450" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Backend Hono -->
    <rect x="560" y="0" width="170" height="40" fill="#313244" stroke="#fab387" stroke-width="2" rx="6"/>
    <text x="645" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Backend Server (Hono)</text>
    <line x1="645" y1="40" x2="645" y2="450" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Pega Platform -->
    <rect x="820" y="0" width="180" height="40" fill="#313244" stroke="#cba6f7" stroke-width="2" rx="6"/>
    <text x="910" y="25" fill="#cba6f7" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pega Platform Server</text>
    <line x1="910" y1="40" x2="910" y2="450" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4"/>
  </g>

  <!-- Sequence Arrows -->
  <!-- 1. SM Trigger Indexing -->
  <line x1="140" y1="130" x2="390" y2="130" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="122" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">1. Trigger Workspace Indexing</text>

  <!-- 2. Extension -> Backend /pega/fetch-rule -->
  <line x1="390" y1="180" x2="645" y2="180" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="517" y="172" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">2. POST /pega/fetch-rule</text>

  <!-- 3. Backend -> Pega REST query -->
  <line x1="645" y1="230" x2="910" y2="230" stroke="#fab387" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777" y="222" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">3. POST /api/v1/rules/query (pxObjClass + appliesTo + pyRuleName)</text>

  <!-- 4. Pega -> Backend return 27KB JSON -->
  <line x1="910" y1="280" x2="645" y2="280" stroke="#cba6f7" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="777" y="272" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">4. Return 27KB+ Full Rule JSON Payload</text>

  <!-- 5. Backend -> Extension response -->
  <line x1="645" y1="330" x2="390" y2="330" stroke="#fab387" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="517" y="322" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">5. Store PostgreSQL (66) &amp; Return Rule AST</text>

  <!-- 6. Extension self save -->
  <path d="M 390 360 L 430 360 L 430 390 L 390 390" fill="none" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="380" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="11" text-anchor="start">6. Save rules/&lt;RuleType&gt;/&lt;RuleName&gt;.pega.json</text>

  <!-- 7. DEV Agent save -->
  <line x1="645" y1="430" x2="910" y2="430" stroke="#fab387" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777" y="422" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">7. DEV Agent: POST /api/v1/rules/save</text>

  <!-- 8. QA Agent test -->
  <line x1="645" y1="470" x2="910" y2="470" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="777" y="462" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">8. QA Agent: POST /api/v1/rules/test</text>

  <!-- Marker Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cdd6f4"/>
    </marker>
  </defs>
</svg>
