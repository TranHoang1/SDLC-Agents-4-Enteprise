  <rect x="730" y="140" width="200" height="45" fill="#313244" stroke="#cba6f7" rx="4"/>
  <text x="830" y="167" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /evaluate-expression</text>

  <rect x="730" y="205" width="200" height="45" fill="#313244" stroke="#cba6f7" rx="4"/>
  <text x="830" y="232" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /simulate-flow</text>

  <rect x="730" y="270" width="200" height="45" fill="#313244" stroke="#cba6f7" rx="4"/>
  <text x="830" y="297" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /evaluate-decision</text>

  <rect x="730" y="335" width="200" height="45" fill="#313244" stroke="#cba6f7" rx="4"/>
  <text x="830" y="362" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /render-section</text>

  <rect x="380" y="200" width="240" height="200" fill="#181825" stroke="#fab387" stroke-width="2" rx="8"/>
