<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <rect width="1000" height="450" fill="#1e1e2e" rx="10"/>
  <text x="500" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">FSD System Context Architecture</text>

  <rect x="50" y="80" width="240" height="70" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="170" y="110" fill="#89b4fa" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pega Rule JSON</text>
  <text x="170" y="130" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Canonical Rule Source</text>

  <rect x="380" y="80" width="240" height="70" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="500" y="110" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Existing L1-L2 Parser</text>
  <text x="500" y="130" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AST &amp; Reference Graph</text>

  <rect x="710" y="80" width="240" height="320" fill="#181825" stroke="#cba6f7" stroke-width="2" rx="8"/>
