  <text x="400" y="260" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">• Expression Parser</text>
  <text x="400" y="295" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">• Workflow Engine</text>
  <text x="400" y="330" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">• Decision Evaluator</text>
  <text x="400" y="365" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">• Security Sandbox</text>

  <line x1="290" y1="115" x2="380" y2="115" stroke="#89b4fa" stroke-width="2"/>
  <line x1="500" y1="150" x2="500" y2="200" stroke="#a6e3a1" stroke-width="2"/>
