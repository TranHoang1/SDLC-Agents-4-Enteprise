<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500">
  <rect width="1100" height="500" fill="#1e1e2e" rx="10"/>
  
  <!-- Title -->
  <text x="550" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Pega REST Bridge Architecture (SA4E-57)</text>
  
  <!-- Zone 1: VS Code Extension -->
  <rect x="40" y="60" width="300" height="400" fill="#181825" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="190" y="90" fill="#89b4fa" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">VS Code Extension Layer</text>
  
  <rect x="60" y="110" width="260" height="60" fill="#313244" stroke="#89b4fa" rx="6"/>
  <text x="190" y="135" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IndexingService.ts</text>
  <text x="190" y="155" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Workspace Materializer &amp; .pega.json Creator</text>

  <rect x="60" y="190" width="260" height="60" fill="#313244" stroke="#89b4fa" rx="6"/>
  <text x="190" y="215" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PegaHttpClient.ts</text>
  <text x="190" y="235" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">REST Bridge Client &amp; Auth Header Manager</text>

  <rect x="60" y="270" width="260" height="60" fill="#313244" stroke="#89b4fa" rx="6"/>
  <text x="190" y="295" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SDLC Agent Chat Panel</text>
  <text x="190" y="315" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">BA, SA, DEV, QA, DevOps UI Controllers</text>

  <rect x="60" y="350" width="260" height="80" fill="#313244" stroke="#a6e3a1" rx="6"/>
  <text x="190" y="375" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Local Workspace Filesystem</text>
  <text x="190" y="395" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">rules/&lt;RuleType&gt;/&lt;RuleName&gt;.pega.json</text>
  <text x="190" y="415" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Full 27KB+ Rich JSON Objects</text>

  <!-- Zone 2: Backend -->
  <rect x="380" y="60" width="340" height="400" fill="#181825" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="550" y="90" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Node.js Backend Server (Hono)</text>

  <rect x="410" y="110" width="280" height="60" fill="#313244" stroke="#a6e3a1" rx="6"/>
  <text x="550" y="135" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">pega-api.ts</text>
  <text x="550" y="155" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Routes: /pega/fetch-rule, /crawl-batch</text>

  <rect x="410" y="190" width="280" height="60" fill="#313244" stroke="#a6e3a1" rx="6"/>
  <text x="550" y="215" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PegaRuleFetcherService.ts</text>
  <text x="550" y="235" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">4-Layer Resilient Fetcher &amp; Session Auth</text>

  <rect x="410" y="270" width="280" height="60" fill="#313244" stroke="#a6e3a1" rx="6"/>
  <text x="550" y="295" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PegaService.ts &amp; AST Engine</text>
  <text x="550" y="315" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AST Parsing &amp; KB Graph Projection</text>

  <rect x="410" y="350" width="280" height="80" fill="#313244" stroke="#cba6f7" rx="6"/>
  <text x="550" y="375" fill="#cba6f7" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PostgreSQL DB (sa4e_db)</text>
  <text x="550" y="395" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">knowledge_entries (66) &amp; graph_nodes (33)</text>
  <text x="550" y="415" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Canonical AST &amp; Graph Nodes</text>

  <!-- Zone 3: Pega Server -->
  <rect x="760" y="60" width="300" height="400" fill="#181825" stroke="#fab387" stroke-width="2" rx="8"/>
  <text x="910" y="90" fill="#fab387" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Pega Platform Server</text>

  <rect x="780" y="110" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="130" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. GET /api/v1/rules/{insKey}</text>

  <rect x="780" y="165" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="185" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. POST /api/v1/rules/query</text>

  <rect x="780" y="220" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="240" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. GET /api/v1/rules/list</text>

  <rect x="780" y="275" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="295" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4. POST /api/v1/rules/save</text>

  <rect x="780" y="330" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="350" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5. POST /api/v1/rules/checkout</text>

  <rect x="780" y="385" width="260" height="45" fill="#313244" stroke="#fab387" rx="6"/>
  <text x="910" y="405" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">6. POST /api/v1/rules/test</text>

  <!-- Connectors -->
  <line x1="320" y1="220" x2="410" y2="140" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4"/>
  <line x1="690" y1="220" x2="780" y2="190" stroke="#a6e3a1" stroke-width="2"/>
</svg>
