<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <rect width="1000" height="500" fill="#1e1e2e" rx="10"/>
  <text x="500" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">TDD High-Level System Architecture (SA4E-57)</text>

  <!-- API Layer -->
  <rect x="100" y="60" width="800" height="70" fill="#181825" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="500" y="85" fill="#89b4fa" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">API Layer (Hono Routes)</text>
  <text x="500" y="110" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">POST /api/pega/evaluate-expression  |  POST /api/pega/simulate-flow  |  POST /api/pega/evaluate-decision</text>

  <!-- Orchestration Layer -->
  <rect x="100" y="170" width="800" height="60" fill="#181825" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="500" y="195" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Orchestration Layer</text>
  <text x="500" y="215" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">PegaService (extended) — Dispatches execution requests to specific L3-L4 modules</text>

  <!-- Module Boxes -->
  <g transform="translate(60, 260)">
    <!-- expression -->
    <rect x="0" y="0" width="160" height="100" fill="#313244" stroke="#fab387" stroke-width="1.5" rx="6"/>
    <text x="80" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">expression/</text>
    <text x="80" y="45" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Lexer &amp; Parser</text>
    <text x="80" y="65" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• AST Evaluator</text>
    <text x="80" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• ClipboardCtx</text>

    <!-- workflow -->
    <rect x="180" y="0" width="160" height="100" fill="#313244" stroke="#fab387" stroke-width="1.5" rx="6"/>
    <text x="260" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">workflow/</text>
    <text x="260" y="45" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• FlowGraph</text>
    <text x="260" y="65" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• WorkEngine</text>
    <text x="260" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• SLA Engine</text>

    <!-- decision -->
    <rect x="360" y="0" width="160" height="100" fill="#313244" stroke="#fab387" stroke-width="1.5" rx="6"/>
    <text x="440" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">decision/</text>
    <text x="440" y="45" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• DT Evaluator</text>
    <text x="440" y="65" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Tree Evaluator</text>
    <text x="440" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Operators</text>

    <!-- ui -->
    <rect x="540" y="0" width="160" height="100" fill="#313244" stroke="#fab387" stroke-width="1.5" rx="6"/>
    <text x="620" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ui/</text>
    <text x="620" y="45" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Section Render</text>
    <text x="620" y="65" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Layout Render</text>
    <text x="620" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Harness Render</text>

    <!-- security -->
    <rect x="720" y="0" width="160" height="100" fill="#313244" stroke="#fab387" stroke-width="1.5" rx="6"/>
    <text x="800" y="25" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">security/</text>
    <text x="800" y="45" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Worker Sandbox</text>
    <text x="800" y="65" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Validator</text>
    <text x="800" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Whitelist</text>
  </g>

  <!-- Foundation L1-L2 -->
  <rect x="100" y="390" width="800" height="60" fill="#181825" stroke="#cba6f7" stroke-width="2" rx="6"/>
  <text x="500" y="415" fill="#cba6f7" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Existing L1-L2 Base Module</text>
  <text x="500" y="435" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">PegaRuleAstParser, PegaLogicNormalizer, PegaRuleResolver, PegaDeclarativeEngine</text>

  <!-- Connectors -->
  <line x1="500" y1="130" x2="500" y2="170" stroke="#89b4fa" stroke-width="2"/>
  <line x1="500" y1="230" x2="500" y2="260" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="500" y1="360" x2="500" y2="390" stroke="#fab387" stroke-width="2"/>
</svg>
