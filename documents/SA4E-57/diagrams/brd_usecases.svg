<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <rect width="1100" height="600" fill="#1e1e2e" rx="10"/>
  
  <!-- Title -->
  <text x="550" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">6 Pega Bridge REST Services Use Cases (SA4E-57)</text>

  <!-- Actors Column -->
  <g transform="translate(50, 70)">
    <!-- BA Agent -->
    <circle cx="40" cy="40" r="20" fill="#89b4fa"/>
    <line x1="40" y1="60" x2="40" y2="100" stroke="#89b4fa" stroke-width="3"/>
    <line x1="20" y1="75" x2="60" y2="75" stroke="#89b4fa" stroke-width="3"/>
    <line x1="40" y1="100" x2="20" y2="130" stroke="#89b4fa" stroke-width="3"/>
    <line x1="40" y1="100" x2="60" y2="130" stroke="#89b4fa" stroke-width="3"/>
    <text x="40" y="150" fill="#89b4fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BA Agent</text>

    <!-- SA Agent -->
    <g transform="translate(0, 130)">
      <circle cx="40" cy="40" r="20" fill="#a6e3a1"/>
      <line x1="40" y1="60" x2="40" y2="100" stroke="#a6e3a1" stroke-width="3"/>
      <line x1="20" y1="75" x2="60" y2="75" stroke="#a6e3a1" stroke-width="3"/>
      <line x1="40" y1="100" x2="20" y2="130" stroke="#a6e3a1" stroke-width="3"/>
      <line x1="40" y1="100" x2="60" y2="130" stroke="#a6e3a1" stroke-width="3"/>
      <text x="40" y="150" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SA Agent</text>
    </g>

    <!-- DEV Agent -->
    <g transform="translate(0, 260)">
      <circle cx="40" cy="40" r="20" fill="#fab387"/>
      <line x1="40" y1="60" x2="40" y2="100" stroke="#fab387" stroke-width="3"/>
      <line x1="20" y1="75" x2="60" y2="75" stroke="#fab387" stroke-width="3"/>
      <line x1="40" y1="100" x2="20" y2="130" stroke="#fab387" stroke-width="3"/>
      <line x1="40" y1="100" x2="60" y2="130" stroke="#fab387" stroke-width="3"/>
      <text x="40" y="150" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DEV Agent</text>
    </g>

    <!-- QA Agent -->
    <g transform="translate(0, 390)">
      <circle cx="40" cy="40" r="20" fill="#cba6f7"/>
      <line x1="40" y1="60" x2="40" y2="100" stroke="#cba6f7" stroke-width="3"/>
      <line x1="20" y1="75" x2="60" y2="75" stroke="#cba6f7" stroke-width="3"/>
      <line x1="40" y1="100" x2="20" y2="130" stroke="#cba6f7" stroke-width="3"/>
      <line x1="40" y1="100" x2="60" y2="130" stroke="#cba6f7" stroke-width="3"/>
      <text x="40" y="150" fill="#cba6f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">QA Agent</text>
    </g>
  </g>

  <!-- Use Cases Boundary Box -->
  <rect x="200" y="60" width="850" height="510" fill="#181825" stroke="#45475a" stroke-width="2" rx="8"/>
  <text x="625" y="85" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Pega Platform Service Package: KiroAgents (6 REST Services)</text>

  <!-- Use Case 1 -->
  <ellipse cx="420" cy="140" rx="180" ry="30" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="420" y="137" fill="#89b4fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-01: Fetch Rule Instance by Handle</text>
  <text x="420" y="152" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">GET /api/v1/rules/{insKey}</text>
  <text x="630" y="145" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Tải 100% dữ liệu XML/JSON (27KB+) của Rule theo pzInsKey</text>

  <!-- Use Case 2 -->
  <ellipse cx="420" cy="220" rx="180" ry="30" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="420" y="217" fill="#89b4fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-02: Query Rule by Identifiers</text>
  <text x="420" y="232" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /api/v1/rules/query</text>
  <text x="630" y="225" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Truy vấn theo bộ 3: pxObjClass + appliesTo + pyRuleName</text>

  <!-- Use Case 3 -->
  <ellipse cx="420" cy="300" rx="180" ry="30" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="420" y="297" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-03: List Application Rules</text>
  <text x="420" y="312" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">GET /api/v1/rules/list</text>
  <text x="630" y="305" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Quét danh sách toàn bộ Rule trong Application &amp; RuleSet</text>

  <!-- Use Case 4 -->
  <ellipse cx="420" cy="380" rx="180" ry="30" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="420" y="377" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-04: Create / Update Pega Rule</text>
  <text x="420" y="392" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /api/v1/rules/save</text>
  <text x="630" y="385" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Đẩy mã nguồn Pega do DEV Agent tự động sinh lên Pega</text>

  <!-- Use Case 5 -->
  <ellipse cx="420" cy="460" rx="180" ry="30" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="420" y="457" fill="#fab387" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-05: Checkout / Checkin Control</text>
  <text x="420" y="472" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /api/v1/rules/checkout</text>
  <text x="630" y="465" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Khóa và checkout Rule an toàn vào Private RuleSet</text>

  <!-- Use Case 6 -->
  <ellipse cx="420" cy="540" rx="180" ry="30" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="420" y="537" fill="#cba6f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UC-06: Execute Scenario Unit Test</text>
  <text x="420" y="552" fill="#a6adc8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">POST /api/v1/rules/test</text>
  <text x="630" y="545" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11">Chạy Scenario Test / Test Suite để QA Agent nghiệm thu</text>

  <!-- Connectors -->
  <line x1="110" y1="120" x2="240" y2="140" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="110" y1="120" x2="240" y2="220" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="110" y1="250" x2="240" y2="300" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="110" y1="380" x2="240" y2="380" stroke="#fab387" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="110" y1="380" x2="240" y2="460" stroke="#fab387" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="110" y1="510" x2="240" y2="540" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="3"/>
</svg>
