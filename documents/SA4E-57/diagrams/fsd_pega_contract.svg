<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <rect width="1000" height="450" fill="#1e1e2e" rx="10"/>
  <text x="500" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">FSD Pega Service Package Contract (KiroAgents)</text>

  <rect x="50" y="80" width="420" height="320" fill="#181825" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="260" y="110" fill="#89b4fa" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Read &amp; Query Contracts</text>
  <text x="70" y="145" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">1. GET /api/v1/rules/{insKey}</text>
  <text x="90" y="170" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: insKey (pzInsKey handle)</text>
  <text x="90" y="190" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Output: 100% full rule JSON payload</text>
  
  <text x="70" y="235" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">2. POST /api/v1/rules/query</text>
  <text x="90" y="260" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: pxObjClass + appliesTo + pyRuleName</text>
  <text x="90" y="280" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Output: Matched rule AST JSON</text>

  <text x="70" y="325" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">3. GET /api/v1/rules/list</text>
  <text x="90" y="350" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: application + ruleset</text>

  <rect x="530" y="80" width="420" height="320" fill="#181825" stroke="#fab387" stroke-width="2" rx="8"/>
  <text x="740" y="110" fill="#fab387" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Write, Lock &amp; Test Contracts</text>
  <text x="550" y="145" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">4. POST /api/v1/rules/save</text>
  <text x="570" y="170" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: Full rule JSON generated by DEV Agent</text>
  <text x="570" y="190" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Output: insKey + save status</text>

  <text x="550" y="235" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">5. POST /api/v1/rules/checkout</text>
  <text x="570" y="260" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: insKey + action (CHECKOUT/CHECKIN)</text>
  
  <text x="550" y="325" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="12">6. POST /api/v1/rules/test</text>
  <text x="570" y="350" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11">• Input: testSuiteID + ruleInsKey</text>
</svg>
