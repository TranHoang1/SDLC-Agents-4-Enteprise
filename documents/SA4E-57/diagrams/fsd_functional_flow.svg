<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <rect width="1000" height="450" fill="#1e1e2e" rx="10"/>
  <text x="500" y="35" fill="#cba6f7" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">FSD Functional Flow: 6 Pega Bridge REST Services</text>

  <rect x="50" y="70" width="260" height="70" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="180" y="98" fill="#89b4fa" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Rule Read Axis</text>
  <text x="180" y="120" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">GET /rules/{key} &amp; POST /rules/query</text>

  <rect x="370" y="70" width="260" height="70" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="500" y="98" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Discovery Axis</text>
  <text x="500" y="120" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">GET /rules/list (App &amp; RuleSet Scan)</text>

  <rect x="690" y="70" width="260" height="70" fill="#313244" stroke="#fab387" stroke-width="2" rx="6"/>
  <text x="820" y="98" fill="#fab387" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Write &amp; Edit Axis</text>
  <text x="820" y="120" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">POST /rules/save (DEV Agent Code Gen)</text>

  <rect x="210" y="220" width="260" height="70" fill="#313244" stroke="#fab387" stroke-width="2" rx="6"/>
  <text x="340" y="248" fill="#fab387" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Governance Axis</text>
  <text x="340" y="270" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">POST /rules/checkout (Lock Control)</text>

  <rect x="530" y="220" width="260" height="70" fill="#313244" stroke="#cba6f7" stroke-width="2" rx="6"/>
  <text x="660" y="248" fill="#cba6f7" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">5. Quality Gate Axis</text>
  <text x="660" y="270" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">POST /rules/test (QA Scenario Suite)</text>

  <rect x="210" y="340" width="580" height="70" fill="#181825" stroke="#45475a" stroke-width="2" rx="6"/>
  <text x="500" y="370" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Workspace Materializer (.pega.json Creator)</text>
  <text x="500" y="392" fill="#a6adc8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Saves full 27KB+ JSON payloads into rules/&lt;RuleType&gt;/&lt;RuleName&gt;.pega.json</text>

  <line x1="180" y1="140" x2="500" y2="340" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="500" y1="140" x2="500" y2="340" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="820" y1="140" x2="500" y2="340" stroke="#fab387" stroke-width="1.5" stroke-dasharray="3"/>
</svg>
