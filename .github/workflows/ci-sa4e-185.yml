name: SA4E-185 L3 CI Pipeline

on:
  push:
    branches: [main, SA4E-185]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  TICKET: 'SA4E-185'

jobs:
  # Phase 4.5: DevOps Pipeline Setup + Security Gates (L3 Autonomy)
  security-gates:
    name: Security Gates (F-01..F-03)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./extension

      # F-01: Prompt-injection fencing - verify diagnostics block is fenced/sanitized
      - name: Security Check F-01 - Prompt Injection Fencing
        run: |
          echo "::group::F-01 Prompt Injection Fencing Check"
          
          # Verify buildSummary uses sanitizeMessage and fencing
          if ! grep -r "sanitizeMessage" extension/src/langgraph/diagnostics/ 2>/dev/null; then
            echo "::error::F-01 FAIL: sanitizeMessage not found in diagnostics feed service"
            exit 1
          fi
          
          # Verify fence delimiters in buildFinalSystemPrompt
          if ! grep -r "<<<BEGIN_DIAGNOSTICS_DATA>>>" extension/src/langgraph/ 2>/dev/null; then
            echo "::error::F-01 FAIL: Fence delimiters not found in system prompt construction"
            exit 1
          fi
          
          # Verify auto-fix trigger uses severity token, not free text
          if grep -r "/\\\\berror\\\\b/" extension/src/langgraph/ 2>/dev/null | grep -v "severity"; then
            echo "::warning::F-01: auto-fix may use free-text 'error' match instead of severity token"
          fi
          
          # Verify adversarial unit tests exist
          if ! find extension/src -name "*.test.ts" -exec grep -l "diagnostics.*injection\|prompt.*injection\|adversarial" {} \; 2>/dev/null | head -1; then
            echo "::warning::F-01: No adversarial prompt injection tests found"
          fi
          
          echo "::endgroup::"

      # F-02: Approval gate wiring - verify ToolApprovalGate is wired at production call site
      - name: Security Check F-02 - Approval Gate Wiring
        run: |
          echo "::group::F-02 Approval Gate Wiring Check"
          
          # Verify router-graph.ts passes real approvalGate (not undefined)
          if grep -r "buildChatSubgraph.*undefined" extension/src/langgraph/router/ 2>/dev/null; then
            echo "::error::F-02 FAIL: router-graph.ts still passes undefined as approvalGate"
            exit 1
          fi
          
          # Verify approvalGate is injected from engine
          if ! grep -r "approvalGate" extension/src/langgraph/router/router-graph.ts 2>/dev/null; then
            echo "::error::F-02 FAIL: approvalGate not wired in router-graph.ts"
            exit 1
          fi
          
          # Verify DANGEROUS_TOOL_PATTERNS includes fs_write, str_replace, fs_append
          if ! grep -r "fs_write\|str_replace\|fs_append" extension/src/chat/engine/ToolApprovalClassifier.ts 2>/dev/null; then
            echo "::error::F-02 FAIL: Write tools fs_write/str_replace/fs_append not in DANGEROUS_TOOL_PATTERNS"
            exit 1
          fi
          
          # Verify e2e test exercises production wiring
          if ! find extension/src -name "*.test.ts" -exec grep -l "approvalGate.*integration\|ToolApprovalGate.*e2e" {} \; 2>/dev/null | head -1; then
            echo "::warning::F-02: No e2e test for approval gate production wiring"
          fi
          
          echo "::endgroup::"

      # F-03: Path containment - verify toWorkspaceRelative exists and is total
      - name: Security Check F-03 - Path Containment Contract
        run: |
          echo "::group::F-03 Path Containment Contract Check"
          
          # Verify toWorkspaceRelative exists in diagnostics-feed-service.ts
          if ! grep -r "toWorkspaceRelative" extension/src/langgraph/diagnostics/ 2>/dev/null; then
            echo "::error::F-03 FAIL: toWorkspaceRelative not found in diagnostics feed service"
            exit 1
          fi
          
          # Verify containment logic rejects traversal (../, absolute, UNC)
          if ! grep -r "startsWith.*\.\." extension/src/langgraph/diagnostics/ 2>/dev/null; then
            echo "::error::F-03 FAIL: Traversal rejection (../) not implemented"
            exit 1
          fi
          
          # Verify path.isAbsolute check
          if ! grep -r "path.isAbsolute" extension/src/langgraph/diagnostics/ 2>/dev/null; then
            echo "::error::F-03 FAIL: Absolute path check not implemented"
            exit 1
          fi
          
          # Verify unit tests for path containment (Windows, UNC, traversal)
          if ! find extension/src -name "*.test.ts" -exec grep -l "toWorkspaceRelative\|path.*containment\|traversal" {} \; 2>/dev/null | head -1; then
            echo "::warning::F-03: No unit tests for path containment edge cases"
          fi
          
          echo "::endgroup::"

      # Additional L3 autonomy checks
      - name: L3 Autonomy - Verify No Manual Gates Before UAT/Deploy
        run: |
          echo "::group::L3 Autonomy Gate Check"
          echo "This pipeline auto-proceeds after security review."
          echo "Manual gates only allowed at: UAT, Deploy"
          echo "Security gates F-01..F-03 are automated in this pipeline."
          echo "::endgroup::"

  # Phase 5: Implementation - TypeScript compilation and linting
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    needs: security-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./extension

      - name: TypeScript Compile
        run: npm run compile
        working-directory: ./extension

      - name: Lint
        run: npm run lint
        working-directory: ./extension

  # Phase 6: Testing - Unit + Integration tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./extension

      - name: Run Unit Tests
        run: npm run test:unit
        working-directory: ./extension

      - name: Run Integration Tests
        run: npm run test:integration
        working-directory: ./extension

  # Phase 7: Security Code Review (post-implementation)
  security-code-review:
    name: Security Code Review
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./extension

      - name: Run Security Agent Code Review
        run: |
          echo "Running security code review for SA4E-185..."
          echo "Verifying C-1 (fencing), C-2 (approval gate), C-3 (path containment) against source..."
          npx tsx scripts/security-code-review.ts SA4E-185

  # Phase 8: Deploy Readiness - Package extension
  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: security-code-review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./extension

      - name: Build Extension
        run: npm run compile
        working-directory: ./extension

      - name: Package VSIX
        run: npx vsce package --no-dependencies
        working-directory: ./extension

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa4e-185-extension
          path: extension/*.vsix
          retention-days: 30

  # Phase 9: UAT Gate (Manual - L3 exception)
  uat:
    name: UAT Gate (Manual Approval)
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Wait for UAT Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: 'product-owner,tech-lead'
          minimum-approvals: 1
          issue-title: 'SA4E-185 UAT Required - LSP Diagnostics Feed'
          issue-body: |
            Please verify the LSP Diagnostics Feed feature:
            - Real-time diagnostics appear in agent loop
            - Auto-fix advisory triggers correctly
            - No prompt injection vulnerabilities (F-01)
            - Approval gate blocks dangerous writes (F-02)
            - Path containment works (F-03)
            
            Security Review: SECURITY-DESIGN-REVIEW.md conditions C-1, C-2, C-3 closed
            
            Approve to proceed to deployment.

  # Phase 10: Deploy (Manual - L3 exception)
  deploy:
    name: Deploy to Marketplace
    runs-on: ubuntu-latest
    needs: uat
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: sa4e-185-extension
          path: ./vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish -p "$VSCE_PAT" ./vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sa4e-185-v${{ github.run_number }}
          name: SA4E-185 LSP Diagnostics Feed
          body: |
            ## LSP Diagnostics Feed — Realtime errors into agent loop
            
            ### Security Conditions Verified
            - ✅ F-01: Prompt injection fencing with sanitizeMessage + fence delimiters
            - ✅ F-02: ToolApprovalGate wired + write tools classified dangerous
            - ✅ F-03: Path containment with traversal rejection
            
            ### Changes
            - New DiagnosticsFeedService streaming LSP diagnostics
            - Auto-fix advisory on error severity
            - DR-1: write_file hook activation
            - DR-2: agentStep node consume-once channel

          files: ./vsix/*.vsix

concurrency:
  group: sa4e-185-${{ github.ref }}
  cancel-in-progress: true